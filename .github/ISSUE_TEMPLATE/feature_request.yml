name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the project makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the project do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Preprocessing / feature engineering
        - Model search / hyperparameter tuning
        - Evaluation / metrics
        - Inference / serving
        - Streamlit UI
        - CLI / MLOps
        - Documentation
        - Other
    validations:
      required: true
