name: Bug report
description: Report something that does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >
        The command you ran and, if possible, a minimal dataset or snippet that
        triggers the problem.
      placeholder: |
        1. python train.py --data my.csv --target y
        2. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Paste the relevant output. Automatically formatted as code.
      render: shell

  - type: input
    id: version
    attributes:
      label: Python version
      placeholder: "3.11.8"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 14 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: dataset
    attributes:
      label: Dataset shape
      description: >
        Rows, columns, and column types involved. Do not upload private data.
