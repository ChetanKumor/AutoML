name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.6,<1"
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check --output-format=github .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest --cov=utils --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Train on the bundled dataset
        run: python train.py --data data/heart-disease.csv --target target --output-dir artifacts
      - name: Verify the artifact loads and predicts
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from utils.model_artifact import ModelArtifact
          from utils.predict import make_prediction, PREDICTION_COLUMN

          artifact_path = next(Path("artifacts").glob("model_*.pkl"))
          artifact = ModelArtifact.load(str(artifact_path))
          print(f"Loaded {artifact.model_name} ({artifact.task_type})")

          df = pd.read_csv("data/heart-disease.csv").drop(columns=["target"])
          predictions = make_prediction(df.head(20), str(artifact_path))
          assert len(predictions) == 20
          assert PREDICTION_COLUMN in predictions.columns
          print("Inference OK")
          PY

  streamlit:
    name: Streamlit app starts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Boot the app and check it serves
        run: |
          streamlit run app.py --server.headless true --server.port 8501 &
          for _ in $(seq 1 30); do
            if curl -sSf http://localhost:8501/_stcore/health; then
              echo "Streamlit is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Streamlit failed to start" >&2
          exit 1
